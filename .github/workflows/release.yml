name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: "go.mod"

      - name: Verify generated syscall tables are up to date
        run: |
          go generate ./...
          git diff --exit-code

      - name: Run unit tests (a release is never cut from untested code)
        run: |
          test -z "$(gofmt -l . )" || { echo 'gofmt needed:'; gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
          node --check action/lib.js
          node --check action/main.js
          node --check action/post.js
          node --test action/action.test.js

  release:
    needs: unit-tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: "go.mod"

      - name: Install pinned Clang/LLVM and SHA-256 verified Cosign
        run: |
          sudo apt-get update && sudo apt-get install -y clang-18 llvm-18
          COSIGN_DIR=$(mktemp -d)
          curl -fsSL https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o "${COSIGN_DIR}/cosign"
          echo "8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b  ${COSIGN_DIR}/cosign" | sha256sum -c -
          sudo install -m 0755 "${COSIGN_DIR}/cosign" /usr/local/bin/cosign
          rm -rf "${COSIGN_DIR}"
          cosign version

      - name: Build deterministic multi-arch release binaries with embedded eBPF bytecode
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: release tag ${TAG_NAME} must match vX.Y.Z"
            exit 1
          fi
          EXPECTED_VER="${TAG_NAME#v}"
          CODE_VER="$(sed -nE 's/^var version = "([^"]+)"/\1/p' cmd/seccomp-profiler/main.go)"
          if [ "$CODE_VER" != "$EXPECTED_VER" ]; then
            echo "ERROR: cmd/seccomp-profiler/main.go version (${CODE_VER}) does not match tag (${EXPECTED_VER})"
            exit 1
          fi

          mkdir -p dist

          make bpf-amd64 CLANG=clang-18
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -tags embed_bpf -trimpath -buildvcs=false -ldflags="-s -w -buildid= -X main.version=${TAG_NAME}" -o dist/seccomp-profiler-linux-amd64 ./cmd/seccomp-profiler

          make bpf-arm64 CLANG=clang-18
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -tags embed_bpf -trimpath -buildvcs=false -ldflags="-s -w -buildid= -X main.version=${TAG_NAME}" -o dist/seccomp-profiler-linux-arm64 ./cmd/seccomp-profiler

          cd dist
          sha256sum seccomp-profiler-linux-amd64 seccomp-profiler-linux-arm64 > checksums.txt
          cat checksums.txt

      - name: Sign binaries and checksums.txt with Sigstore Cosign (keyless OIDC)
        run: |
          cd dist
          CERT_REGEX='^https://github\.com/alexno10/seccomp-profiler/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'
          OIDC_ISSUER='https://token.actions.githubusercontent.com'

          for artifact in seccomp-profiler-linux-amd64 seccomp-profiler-linux-arm64 checksums.txt; do
            cosign sign-blob --yes \
              --output-signature "${artifact}.sig" \
              --output-certificate "${artifact}.pem" \
              "${artifact}"
            cosign verify-blob \
              --certificate "${artifact}.pem" \
              --signature "${artifact}.sig" \
              --certificate-identity-regexp "${CERT_REGEX}" \
              --certificate-oidc-issuer "${OIDC_ISSUER}" \
              "${artifact}"
          done

      - name: Publish GitHub Release (tag pushes only — never overwrite published assets)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; refusing to overwrite published assets (re-tag as a new version instead)."
            exit 1
          fi
          gh release create "$TAG_NAME" dist/* --title "$TAG_NAME" --generate-notes
