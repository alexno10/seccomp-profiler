name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-ebpf-integration:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: "go.mod"

      - name: Lint (gofmt, go vet) and verify generated syscall tables
        run: |
          test -z "$(gofmt -l . )" || { echo 'gofmt needed:'; gofmt -l .; exit 1; }
          go vet ./...
          go generate ./...
          git diff --exit-code
          node --check action/lib.js
          node --check action/main.js
          node --check action/post.js
          node --test action/action.test.js
          go test ./... -v

      - name: Compile eBPF program and install seccomp-profiler
        run: |
          sudo apt-get update && sudo apt-get install -y clang llvm
          make bpf build
          sudo install -m 0755 bin/seccomp-profiler /usr/local/bin/seccomp-profiler
          rm -f bpf/profiler.bpf.o internal/ebpf/profiler.bpf.o
          docker pull alpine:3.20

      - name: Start Seccomp Profiler Action (mode=start)
        uses: ./
        with:
          mode: start
          fail-on: none # the positive e2e tests below intentionally add high-risk syscalls; the gate is asserted manually
        env:
          # Exercise the freshly built binary instead of downloading the
          # pinned release artifact.
          SECCOMP_PROFILER_BIN: /usr/local/bin/seccomp-profiler

      - name: Verify sudo daemon environment has zero leaked tokens and run containers
        run: |
          DAEMON_PID=$(pgrep -f "seccomp-profiler daemon" | head -n 1)
          test -n "$DAEMON_PID"
          echo "=== daemon log (attach diagnostics) ==="
          sudo cat /tmp/seccomp-profiler-daemon.log || true
          echo "=== end daemon log ==="
          # sudo cat runs the reader as root; a plain "< /proc/..." redirect
          # would silently fail as the non-root step user and void the check.
          if sudo cat "/proc/${DAEMON_PID}/environ" | tr '\0' '\n' | grep -E '^(GITHUB_TOKEN|GH_TOKEN|INPUT_GITHUB|ACTIONS_RUNTIME_TOKEN|RUNNER_TRACKING_ID)='; then
            echo "ERROR: sensitive token or tracking ID leaked into sudo daemon environment!"
            exit 1
          fi

          # 1. Ultra-short-lived (<100ms) container
          docker run --rm alpine:3.20 true

          # 2. Container with secondary docker exec (also exercises die-cleanup)
          CID=$(docker run -d --rm alpine:3.20 sleep 5)
          docker exec "$CID" uname -a
          docker stop -t 1 "$CID" || true

          # 3. Infra sidecar container with Ryuk label (should be auto-excluded)
          docker run --rm --label org.testcontainers.ryuk=true alpine:3.20 echo "ryuk-sidecar"

          # 4. Positive e2e: the profiler MUST observe a high-risk syscall
          #    instead of letting it pass silently. add_key/keyctl are
          #    high-risk yet need no capabilities, unlike unshare which the
          #    current runner fleet refuses even with CAP_SYS_ADMIN.
          #    seccomp=unconfined only lifts Docker's own default profile,
          #    which blocks add_key exactly like our gate would.
          docker run --rm --security-opt seccomp=unconfined alpine:3.20 sh -c 'apk add --no-cache keyutils >/dev/null && keyctl add user seccomp-probe probe-value @u'

          # 5. Application re-exec via /proc/self/exe must be recorded, not
          #    suppressed as runtime self-exec. exec -a keeps busybox
          #    dispatching to the echo applet despite argv[0] rewriting.
          docker run --rm alpine:3.20 sh -c 'exec -a echo /proc/self/exe re-exec-ok'

      - name: Stop Seccomp Profiler Action (mode=stop)
        id: stop_profiler
        uses: ./
        with:
          mode: stop
        env:
          SECCOMP_PROFILER_BIN: /usr/local/bin/seccomp-profiler

      - name: Verify Action outputs, eBPF profile accuracy, enforcement, diff, and merge
        run: |
          test "${{ steps.stop_profiler.outputs.gate-passed }}" = "true"
          # Positive e2e gate: the keyctl probe must be counted as unapproved high-risk.
          test "${{ steps.stop_profiler.outputs.high-risk-count }}" -ge 1
          test "${{ steps.stop_profiler.outputs.profiles-dir }}" = ".seccomp-profiler/profiles"
          test "${{ steps.stop_profiler.outputs.new-syscalls-count }}" -gt 0

          test -f .seccomp-profiler/profiles/alpine.json
          test -f .seccomp-profiler/raw/alpine.profile.v1.json

          # Verify runc init / docker exec setup syscalls (mount, pivot_root, setns) did NOT leak.
          for leaked in mount pivot_root setns; do
            if grep -q "\"${leaked}\"" .seccomp-profiler/profiles/alpine.json; then
              echo "ERROR: ${leaked} leaked into alpine.json"
              echo "--- daemon log ---"
              sudo cat /tmp/seccomp-profiler-daemon.log || true
              echo "--- leaked syscall provenance ---"
              node -e '
                const r = require("./.seccomp-profiler/raw/alpine.profile.v1.json");
                console.log(JSON.stringify(r.syscalls["setns"] || {}, null, 1));
                console.log(JSON.stringify(r.syscalls["mount"] || {}, null, 1));
                console.log("containers:", JSON.stringify(r.target.containers.map(c => ({ id: c.id.slice(0, 8), image: c.image, bins: undefined })), null, 1));
              '
              exit 1
            fi
          done

          # Verify 64-bit container syscalls were NOT misclassified as 32-bit compat,
          # that Ryuk was excluded (4 profiled containers), and that the positive e2e
          # syscalls (add_key of the keyctl probe, execve of the /proc/self/exe
          # re-exec) were really captured by the eBPF hooks.
          node -e '
            const fs = require("node:fs");
            const raw = JSON.parse(fs.readFileSync(".seccomp-profiler/raw/alpine.profile.v1.json", "utf8"));
            if (raw.target.compatSyscallCount !== 0) {
              throw new Error(`Expected compatSyscallCount=0, got ${raw.target.compatSyscallCount}`);
            }
            if (raw.target.containerCount !== 4) {
              throw new Error(`Expected containerCount=4 (ryuk excluded), got ${raw.target.containerCount}`);
            }
            const observed = Object.entries(raw.syscalls || {}).filter(([, v]) => (v.sources || []).includes("observed"));
            if (observed.length === 0) {
              throw new Error("Expected >0 observed syscalls from eBPF");
            }
            if (!raw.syscalls["add_key"] || !raw.syscalls["add_key"].sources.includes("observed")) {
              throw new Error("POSITIVE e2e FAILED: eBPF did not observe the keyctl/add_key probe!");
            }
            if (!raw.syscalls["execve"] || !raw.syscalls["execve"].sources.includes("observed")) {
              throw new Error("POSITIVE e2e FAILED: /proc/self/exe re-exec was suppressed instead of recorded!");
            }
            // Generated profiles must constrain clone namespace creation.
            const profile = JSON.parse(fs.readFileSync(".seccomp-profiler/profiles/alpine.json", "utf8"));
            if (profile.defaultErrnoRet !== 38) {
              throw new Error(`Expected defaultErrnoRet=38 (ENOSYS), got ${profile.defaultErrnoRet}`);
            }
          '

          # Re-run container enforced by generated seccomp profile
          docker run --rm --security-opt seccomp=.seccomp-profiler/profiles/alpine.json alpine:3.20 uname -a

          # Verify CLI diff + security gate (unapproved high-risk fails; accepted.yml passes; on-change=update-pr works)
          cp .seccomp-profiler/profiles/alpine.json /tmp/committed.json
          node -e '
            const fs = require("node:fs");
            const p = JSON.parse(fs.readFileSync("/tmp/committed.json", "utf8"));
            p.syscalls[0].names.push("ptrace");
            fs.writeFileSync("/tmp/drifted.json", JSON.stringify(p, null, 2));
          '
          # A clone allow that lost its arg constraint must fail the gate
          # (conditional -> unconditional escalation, review item 2/12).
          node -e '
            const fs = require("node:fs");
            const p = JSON.parse(fs.readFileSync("/tmp/committed.json", "utf8"));
            p.syscalls = p.syscalls.filter(r => !((r.names || []).includes("clone")));
            p.syscalls.push({ names: ["clone"], action: "SCMP_ACT_ALLOW", args: [{ index: 0, value: 2114060288, valueTwo: 0, op: "SCMP_CMP_MASKED_EQ" }] });
            fs.writeFileSync("/tmp/committed-clone.json", JSON.stringify(p, null, 2));
            const c = JSON.parse(fs.readFileSync("/tmp/committed-clone.json", "utf8"));
            c.syscalls = c.syscalls.filter(r => !((r.names || []).includes("clone")));
            c.syscalls.push({ names: ["clone"], action: "SCMP_ACT_ALLOW" });
            fs.writeFileSync("/tmp/escalated.json", JSON.stringify(c, null, 2));
          '
          if seccomp-profiler diff --target alpine --committed /tmp/committed-clone.json --current /tmp/escalated.json --fail-on high-risk; then
            echo "ERROR: expected conditional->unconditional clone escalation to fail security gate"
            exit 1
          fi
          if seccomp-profiler diff --target alpine --committed /tmp/committed.json --current /tmp/escalated.json --fail-on high-risk; then
            echo "ERROR: expected conditional->unconditional clone escalation to fail security gate"
            exit 1
          fi
          cat > /tmp/accepted.yml <<'EOF'
          version: 1
          accepted:
            - target: alpine
              syscall: ptrace
              reason: "CI gate test approval"
          EOF
          seccomp-profiler diff --target alpine --committed /tmp/committed.json --current /tmp/drifted.json --allow-file /tmp/accepted.yml --on-change update-pr --fail-on high-risk

          # Verify CLI merge across multiple .profile.v1.json shards
          mkdir -p /tmp/shards/s1 /tmp/shards/s2 /tmp/merged-profiles /tmp/merged-raw
          cp .seccomp-profiler/raw/alpine.profile.v1.json /tmp/shards/s1/alpine.profile.v1.json
          node -e '
            const fs = require("node:fs");
            const raw = JSON.parse(fs.readFileSync(".seccomp-profiler/raw/alpine.profile.v1.json", "utf8"));
            raw.target.containers = [{ id: "extra_shard_container_id", image: "alpine:3.20", durationMs: 42 }];
            raw.target.containerCount = 1;
            raw.syscalls["nanosleep"] = { sources: ["observed"], totalCalls: 7, containersSeen: 1 };
            fs.writeFileSync("/tmp/shards/s2/alpine.profile.v1.json", JSON.stringify(raw, null, 2));
          '
          seccomp-profiler merge --input-dir /tmp/shards --output-dir /tmp/merged-profiles --raw-dir /tmp/merged-raw --lock-file /tmp/merged-lock.json --committed-profile /tmp/committed.json
          test -f /tmp/merged-profiles/alpine.json
          test -f /tmp/merged-raw/alpine.profile.v1.json

  test-post-hook-and-release-cosign:
    # Fork PRs cannot get id-token: write — skip instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Pre-pull test container image
        run: |
          test ! -f /opt/seccomp-profiler/v1.1.0/seccomp-profiler
          docker pull alpine:3.20

      - name: Start Seccomp Profiler Action (downloads v1.1.0 release, verifies checksums.txt.sig + pinned SHA-256 + Cosign, auto-stops in post hook)
        uses: ./

      - name: Run container workload and verify negative Cosign identity rejection
        run: |
          test -x /opt/seccomp-profiler/v1.1.0/seccomp-profiler
          docker run --rm alpine:3.20 echo "testing v1.1.0 release binary + cosign + automatic post hook teardown"

          # Negative Test: Sign a binary with THIS workflow's OIDC identity (ci.yml@refs/heads/main)
          # and prove that verifyCosignSignature rejects both wrong workflow/ref and wrong repository!
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            COSIGN_ARCH="arm64"
            COSIGN_SHA="3b2e2e3854d0356c45fe6607047526ccd04742d20bd44afb5be91fa2a6e7cb4a"
          else
            COSIGN_ARCH="amd64"
            COSIGN_SHA="8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b"
          fi
          curl -fsSL "https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-${COSIGN_ARCH}" -o /tmp/cosign-neg
          echo "${COSIGN_SHA}  /tmp/cosign-neg" | sha256sum -c -
          chmod +x /tmp/cosign-neg

          /tmp/cosign-neg sign-blob --yes \
            --output-signature /tmp/ci-signed.sig \
            --output-certificate /tmp/ci-signed.pem \
            /opt/seccomp-profiler/v1.1.0/seccomp-profiler

          # 1. Must FAIL when verified against the strict release.yml@refs/tags/v... identity in action/lib.js
          node -e '
            const { verifyCosignSignature } = require("./action/lib.js");
            try {
              verifyCosignSignature("/tmp/cosign-neg", "/opt/seccomp-profiler/v1.1.0/seccomp-profiler", "/tmp/ci-signed.sig", "/tmp/ci-signed.pem");
              console.error("ERROR: verifyCosignSignature accepted a certificate signed by ci.yml instead of release.yml!");
              process.exit(1);
            } catch (err) {
              console.log("PASS: Rejected binary signed by non-release workflow:", err.message);
            }
          '

          # 2. Must FAIL when verified against a different repository identity
          node -e '
            const { verifyCosignSignature } = require("./action/lib.js");
            try {
              verifyCosignSignature(
                "/tmp/cosign-neg",
                "/opt/seccomp-profiler/v1.1.0/seccomp-profiler",
                "/tmp/ci-signed.sig",
                "/tmp/ci-signed.pem",
                "^https://github\\.com/other-owner/seccomp-profiler/\\.github/workflows/ci\\.yml@refs/heads/main$"
              );
              console.error("ERROR: verifyCosignSignature accepted a certificate from a different repo!");
              process.exit(1);
            } catch (err) {
              console.log("PASS: Rejected binary when repository owner does not match:", err.message);
            }
          '
